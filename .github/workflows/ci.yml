name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pytest==8.4.1 bandit==1.8.6 numpy==2.4.6
      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: pytest -q
      - name: Classifier smoke test
        run: python3 bin/recall-classifier.py --test
      - name: Recall eval (regression gate)
        # Runs the n=36 gold set against the committed signed fixture store
        # (never the live store), semantic-off/hermetic. Fails the build if
        # recall or companionship drops below the committed floors, if any
        # fixture fact stops verifying, or if the cap-lever self-test inverts.
        # See docs/evals/README.md.
        run: python3 bin/recall-eval.py --gate
      - name: Bandit scan
        run: bandit -r bin
      - name: Gitleaks scan
        run: gitleaks detect --source . --redact --config .gitleaks.toml --no-banner

  floor:
    # The hook's real floor is stock macOS python3 = 3.9; the test matrix
    # above (3.11/3.12) never exercises it, so 3.10-only import-time syntax
    # passed CI twice and then broke recall on a real Mac. This job runs the
    # floor tests under a genuine 3.9 interpreter: NOCKBRAIN_FLOOR_PYTHON
    # points the import-smoke subprocess at it, and the classifier smoke
    # executes a real hook entrypoint. No numpy on purpose — the stock
    # interpreter the hook falls back to has none either, so every closure
    # module must import without it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.9"
      - name: Install test deps
        run: pip install pytest==8.4.1
      - name: Floor tests under 3.9
        run: NOCKBRAIN_FLOOR_PYTHON="$(command -v python3)" python3 -m pytest -q tests/test_python_floor.py
      - name: Classifier smoke under 3.9
        run: python3 bin/recall-classifier.py --test
